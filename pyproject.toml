[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-applyspectrallock"
version = "1.0.0"
description = "ApplySpectralLock — latent spectral handoff for Flux.1 / Rectified Flow and USDU tiled upscaling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lookuters22" }]
dependencies = ["torch"]

[project.urls]
Repository = "https://github.com/lookuters22/ComfyUI-ApplySpectralLock"

# Comfy Registry (optional): https://docs.comfy.org/registry/overview
[tool.comfy]
PublisherId = "lookuters22"
DisplayName = "ApplySpectralLock"
Icon = ""
